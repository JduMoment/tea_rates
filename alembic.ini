# Миграции схемы БД. Адрес базы берётся из back/core/config.py (DATABASE_URL или POSTGRES_*), не отсюда.
#   alembic upgrade head                      — применить все миграции
#   alembic revision --autogenerate -m "..."  — новая миграция по изменениям моделей
[alembic]
script_location = %(here)s/back/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
